name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:14-3.5-alpine
        env:
          POSTGRES_DB: aero_arc_test
          POSTGRES_USER: aero_arc_test
          POSTGRES_PASSWORD: aero_arc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aero_arc_test -d aero_arc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AERO_API_TEST_POSTGIS_URL: postgres://aero_arc_test:aero_arc_test@localhost:5432/aero_arc_test?sslmode=disable
      AERO_API_TEST_INFLUXDB_HOST: http://localhost:8181
      AERO_API_TEST_INFLUXDB_TOKEN: integration-test-token
      AERO_API_TEST_INFLUXDB_DATABASE: aero_arc_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start InfluxDB 3 Core
        run: >-
          docker run --detach --name influxdb3 --publish 8181:8181
          influxdb:3.10.3-core influxdb3 serve --node-id=api-ci
          --object-store=memory --without-auth
      - name: Configure InfluxDB test database
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://localhost:8181/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --show-error --silent \
            --header 'Content-Type: application/json' \
            --data '{"db":"aero_arc_test"}' \
            http://localhost:8181/api/v3/configure/database
      - run: mkdir -p coverage
      - run: go test -tags=integration -coverprofile=coverage/coverage.out -covermode=atomic ./...
      - run: go vet ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: ./coverage/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: true
          version: v2.12
