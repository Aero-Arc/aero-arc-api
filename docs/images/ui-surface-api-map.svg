<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2180" viewBox="0 0 1600 2180" role="img" aria-labelledby="title desc">
  <title id="title">UI surfaces flowing through Aero Arc API endpoints to backend sources</title>
  <desc id="desc">Ten horizontal flows show each UI surface, implementation maturity, HTTP endpoint, response model, backend entities, and source-of-truth notes. A maturity rail highlights implemented and first-slice paths.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#63758a"/></marker></defs>
  <style>
    :root{color-scheme:light dark}.bg{fill:#f6f8fb}.lane{fill:#fff;stroke:#d0d8e3}.route{fill:none;stroke:#63758a;stroke-width:2.5;marker-end:url(#arrow)}.spine{stroke:#9aa8b9;stroke-width:4}.surface{fill:#173d6b}.first{fill:#7656c9}.done{fill:#228652}.existing{fill:#8b98a8}.endpoint{fill:#e8f2ff;stroke:#5d9ee0}.response{fill:#eee9ff;stroke:#876bd2}.source{fill:#eaf5ee;stroke:#68aa80}
    .title{fill:#14243a;font:700 34px system-ui,sans-serif}.head{fill:#5b6d82;font:700 15px system-ui,sans-serif;letter-spacing:1px}.name{fill:#14243a;font:700 21px system-ui,sans-serif}.code{fill:#0b5cab;font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace}.longRoute{font-size:14px}.model{fill:#5c42a4;font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace}.text{fill:#293b50;font:16px system-ui,sans-serif}.status{fill:#fff;font:700 12px system-ui,sans-serif}.legend{fill:#506278;font:15px system-ui,sans-serif}
    @media(prefers-color-scheme:dark){.bg{fill:#0d1520}.lane{fill:#151f2c;stroke:#435269}.endpoint{fill:#173552;stroke:#3977ac}.response{fill:#302554;stroke:#7059aa}.source{fill:#173d2a;stroke:#3d9361}.title,.name{fill:#f0f5fb}.head,.legend{fill:#aab8ca}.text{fill:#d7e0eb}.code{fill:#80c3ff}.model{fill:#cbbdff}}
  </style>
  <rect class="bg" width="1600" height="2180" rx="24"/><text class="title" x="65" y="75">UI → API boundary → authoritative data</text>
  <text class="head" x="100" y="132">SURFACE + MATURITY</text><text class="head" x="405" y="132">HTTP ROUTE</text><text class="head" x="850" y="132">RESPONSE</text><text class="head" x="1135" y="132">ENTITIES + SOURCE OF TRUTH</text>
  <line class="spine" x1="84" y1="165" x2="84" y2="2080"/>

  <g transform="translate(65 160)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="existing" cx="19" cy="38" r="19"/><text class="status" x="14" y="42">E</text><text class="name" x="64" y="42">Overview</text><text class="legend" x="64" y="68">Existing API · UI not wired</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code" x="342" y="53">GET /api/v1/overview</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="53">OverviewDashboard</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="31">AircraftDashboard · OperationalIntent</text><text class="text" x="1110" y="53">EvidenceRecord · ReportabilityReview</text><text class="text" x="1110" y="75">DashboardMetric</text><text class="text" x="320" y="112">Composite API response from durable records plus live aircraft dashboards</text></g>
  <g transform="translate(65 350)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="existing" cx="19" cy="38" r="19"/><text class="status" x="14" y="42">E</text><text class="name" x="64" y="42">Operations</text><text class="legend" x="64" y="68">Existing API · UI mostly absent</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code" x="342" y="53">GET /api/v1/operations</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="53">OperationsDashboard</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="42">OperationalIntent · ConformanceSummary</text><text class="text" x="1110" y="66">DashboardMetric</text><text class="text" x="320" y="112">Durable operational records and conformance summaries</text></g>
  <g transform="translate(65 540)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="existing" cx="19" cy="38" r="19"/><text class="status" x="14" y="42">E</text><text class="name" x="64" y="42">Preflight</text><text class="legend" x="64" y="68">Existing API · UI absent</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code" x="342" y="53">GET /api/v1/preflight</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="53">PreflightDashboard</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="42">PreflightCheck · DashboardMetric</text><text class="text" x="320" y="112">Durable and auditable preflight records</text></g>
  <g transform="translate(65 730)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="existing" cx="19" cy="38" r="19"/><text class="status" x="14" y="42">E</text><text class="name" x="64" y="42">Conformance</text><text class="legend" x="64" y="68">Existing API · UI placeholder only</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code" x="342" y="53">GET /api/v1/conformance</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="53">ConformanceDashboard</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="42">ConformanceSummary · ConformanceEvent</text><text class="text" x="1110" y="66">DashboardMetric</text><text class="text" x="320" y="112">Durable conformance records, often telemetry-derived upstream</text></g>
  <g transform="translate(65 920)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="existing" cx="19" cy="38" r="19"/><text class="status" x="14" y="42">E</text><text class="name" x="64" y="42">Maintenance</text><text class="legend" x="64" y="68">Existing API · UI partial</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code" x="342" y="53">GET /api/v1/maintenance</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="53">MaintenanceDashboard</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="42">MaintenanceEvent · Battery</text><text class="text" x="1110" y="66">DashboardMetric</text><text class="text" x="320" y="112">Durable maintenance and battery lifecycle records</text></g>
  <g transform="translate(65 1110)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="existing" cx="19" cy="38" r="19"/><text class="status" x="14" y="42">E</text><text class="name" x="64" y="42">Records</text><text class="legend" x="64" y="68">Existing API · UI absent</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code" x="342" y="53">GET /api/v1/records</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="53">RecordsDashboard</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="42">EvidenceRecord · ReportabilityReview</text><text class="text" x="1110" y="66">DashboardMetric</text><text class="text" x="320" y="112">Durable evidence and reportability workflow records</text></g>
  <g transform="translate(65 1300)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="first" cx="19" cy="38" r="19"/><text class="status" x="15" y="42">1</text><text class="name" x="64" y="42">Fleet aircraft list</text><text class="legend" x="64" y="68">First UI slice</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code" x="342" y="53">GET /api/v1/aircraft</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="43">{ "aircraft":</text><text class="model" x="790" y="64">AircraftDashboard[] }</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="31">Aircraft · Battery · MaintenanceEvent</text><text class="text" x="1110" y="53">TelemetrySample · LiveAircraftState</text><text class="text" x="1110" y="75">Readiness</text><text class="text" x="320" y="112">Durable aircraft + active battery + latest telemetry + registry live state</text></g>
  <g transform="translate(65 1490)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="first" cx="19" cy="38" r="19"/><text class="status" x="15" y="42">1</text><text class="name" x="64" y="42">Aircraft detail</text><text class="legend" x="64" y="68">First UI slice</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code longRoute" x="338" y="53">GET /api/v1/aircraft/{aircraft_id}</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="53">AircraftDashboard</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="31">Aircraft · Battery · MaintenanceEvent</text><text class="text" x="1110" y="53">TelemetrySample · LiveAircraftState</text><text class="text" x="1110" y="75">Readiness</text><text class="text" x="320" y="112">Bare dashboard object for one aircraft</text></g>
  <g transform="translate(65 1680)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="done" cx="19" cy="38" r="19"/><text class="status" x="13" y="42">✓</text><text class="name" x="64" y="42">Aircraft live state</text><text class="legend" x="64" y="68">Implemented</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code longRoute" x="332" y="53">GET /api/v1/aircraft/{aircraft_id}/state</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="53">AircraftLiveState</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="42">Registry agent/placement + independent</text><text class="text" x="1110" y="66">InfluxDB message groups</text><text class="text" x="320" y="112">Focused live-state response; missing groups are omitted</text></g>
  <g transform="translate(65 1870)"><rect class="lane" x="35" width="1465" height="178" rx="16"/><circle class="existing" cx="19" cy="38" r="19"/><text class="status" x="14" y="42">E</text><text class="name" x="64" y="42">Replay</text><text class="legend" x="64" y="68">Existing API · UI absent</text><rect class="endpoint" x="320" y="22" width="395" height="50" rx="25"/><text class="code longRoute" x="326" y="53">GET /api/v1/flights/{flight_id}/replay</text><path class="route" d="M715 47H760"/><rect class="response" x="770" y="22" width="285" height="50" rx="14"/><text class="model" x="790" y="53">ReplayResponse</text><path class="route" d="M1055 47H1095"/><text class="text" x="1110" y="42">FlightRecord · ReplayManifest</text><text class="text" x="1110" y="66">TelemetrySample · ConformanceEvent</text><text class="text" x="320" y="112">Durable flight + replay-store manifest + telemetry samples</text></g>
  <g transform="translate(100 2080)"><circle class="existing" cx="12" cy="12" r="12"/><text class="legend" x="34" y="18">E · existing API</text><circle class="first" cx="210" cy="12" r="12"/><text class="legend" x="232" y="18">1 · first UI slice</text><circle class="done" cx="410" cy="12" r="12"/><text class="legend" x="432" y="18">✓ · implemented live slice</text></g>
</svg>
