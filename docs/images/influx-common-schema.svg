<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
  <title id="title">Relay to InfluxDB common telemetry schema pipeline</title>
  <desc id="desc">A pipeline from a normalized Relay record into the aircraft_telemetry measurement and onward to the API, with four required tags, event time, required common fields, aircraft-attribution fields, operation context, and optional timing and MAVLink metadata.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#5b6d82"/></marker></defs>
  <style>
    :root { color-scheme: light dark; } .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#c8d3df;stroke-width:2}.relay{fill:#e8f2ff;stroke:#5d9ee0}.influx{fill:#eee9ff;stroke:#876bd2}.api{fill:#e5f7ed;stroke:#55a878}.line{fill:none;stroke:#5b6d82;stroke-width:3;marker-end:url(#arrow)}
    .title{fill:#14243a;font:700 34px system-ui,sans-serif}.h{fill:#14243a;font:700 24px system-ui,sans-serif}.sub{fill:#4e6178;font:18px system-ui,sans-serif}.label{fill:#62748a;font:700 14px system-ui,sans-serif;letter-spacing:1px}.code{fill:#0b5cab;font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace}.text{fill:#27394f;font:17px system-ui,sans-serif}.req{fill:#dff4e7;stroke:#4fa672}.cond{fill:#fff2d6;stroke:#d29a2c}.opt{fill:#edf0f4;stroke:#9aa8b9}.reqT{fill:#17643a;font:700 14px system-ui,sans-serif}.condT{fill:#795713;font:700 14px system-ui,sans-serif}.optT{fill:#4f6073;font:700 14px system-ui,sans-serif}
    @media(prefers-color-scheme:dark){.bg{fill:#0d1520}.panel{fill:#151f2c;stroke:#435269}.relay{fill:#173552;stroke:#3977ac}.influx{fill:#302554;stroke:#7059aa}.api{fill:#173d2a;stroke:#3d9361}.title,.h{fill:#f0f5fb}.sub,.label{fill:#aab8ca}.text{fill:#d7e0eb}.code{fill:#80c3ff}.req{fill:#173d2a;stroke:#3d9361}.reqT{fill:#a8e7c0}.cond{fill:#493819;stroke:#9f792a}.condT{fill:#f2d28b}.opt{fill:#273342;stroke:#59687a}.optT{fill:#c3cedb}}
  </style>
  <rect class="bg" width="1600" height="1900" rx="24"/><text class="title" x="70" y="82">One frame becomes one queryable observation</text><text class="sub" x="70" y="116">Common schema owned by Relay’s point writer; read by the API’s Influx store</text>
  <g transform="translate(70 155)"><rect class="relay" width="360" height="150" rx="24"/><text class="label" x="28" y="38">RELAY</text><text class="h" x="28" y="76">Normalized record</text><text class="text" x="28" y="108">One MAVLink message</text><text class="text" x="28" y="132">validated against schema v1</text></g>
  <path class="line" d="M430 230 H600"/><g transform="translate(610 155)"><rect class="influx" width="440" height="150" rx="24"/><text class="label" x="28" y="38">INFLUXDB 3</text><text class="h" x="28" y="76">aircraft_telemetry</text><text class="text" x="28" y="108">One point · one message group</text><text class="text" x="28" y="132">not a complete aircraft snapshot</text></g>
  <path class="line" d="M1050 230 H1215"/><g transform="translate(1225 155)"><rect class="api" width="305" height="150" rx="24"/><text class="label" x="28" y="38">AERO-ARC-API</text><text class="h" x="28" y="76">Latest per group</text><text class="text" x="28" y="108">partition: aircraft_id</text><text class="text" x="28" y="132">+ message_name</text></g>

  <path class="line" d="M830 305 V365"/><g transform="translate(70 380)"><rect class="panel" width="1460" height="250" rx="22"/><text class="label" x="28" y="38">IDENTITY + IDEMPOTENCY · ALWAYS TAGS</text>
    <g transform="translate(28 62)"><rect class="req" width="326" height="105" rx="16"/><text class="code" x="20" y="34">agent_id</text><text class="text" x="20" y="65">Agent that produced the frame</text></g>
    <g transform="translate(378 62)"><rect class="req" width="326" height="105" rx="16"/><text class="code" x="20" y="34">frame_id</text><text class="text" x="20" y="65">Stable agent-WAL idempotency key</text><text class="text" x="20" y="87">unchanged by retry or reconnect</text></g>
    <g transform="translate(728 62)"><rect class="req" width="326" height="105" rx="16"/><text class="code" x="20" y="34">message_name</text><text class="text" x="20" y="65">Canonical normalized group</text></g>
    <g transform="translate(1078 62)"><rect class="req" width="326" height="105" rx="16"/><text class="code" x="20" y="34">schema_version</text><text class="text" x="20" y="65">Normalized-record schema</text><text class="text" x="20" y="87">decimal string · current “1”</text></g>
    <rect class="req" x="28" y="185" width="1376" height="42" rx="12"/><text class="code" x="48" y="212">time</text><text class="text" x="135" y="212">Influx timestamp · normalized event time · newest-row ordering · API recorded_at</text>
  </g>

  <path class="line" d="M830 630 V682"/><g transform="translate(70 695)"><rect class="panel" width="1460" height="286" rx="22"/><text class="label" x="28" y="38">COMMON FIELDS</text>
    <g transform="translate(28 62)"><rect class="req" width="420" height="84" rx="15"/><text class="code" x="18" y="31">relay_id · string</text><text class="text" x="18" y="59">Required · relay that wrote the frame</text></g>
    <g transform="translate(474 62)"><rect class="cond" width="480" height="84" rx="15"/><text class="code" x="18" y="31">aircraft_id · string</text><text class="text" x="18" y="59">Durable assignment · required for aircraft API reads</text></g>
    <g transform="translate(980 62)"><rect class="req" width="424" height="84" rx="15"/><text class="code" x="18" y="31">session_id · string</text><text class="text" x="18" y="59">Required · opaque registration/connection lifecycle</text></g>
    <g transform="translate(28 166)"><rect class="req" width="420" height="84" rx="15"/><text class="code" x="18" y="31">wal_sequence · uint64</text><text class="text" x="18" y="59">Required durable agent sequence</text></g>
    <g transform="translate(474 166)"><rect class="req" width="480" height="84" rx="15"/><text class="code" x="18" y="31">message_id · uint64</text><text class="text" x="18" y="59">Required MAVLink message ID</text></g>
    <g transform="translate(980 166)"><rect class="req" width="424" height="84" rx="15"/><text class="code" x="18" y="31">dialect · string</text><text class="text" x="18" y="59">Required MAVLink dialect</text></g>
    <text class="text" x="28" y="274">session_id may change after registration or reconnect; unlike frame_id, it is not an idempotency key.</text>
  </g>

  <path class="line" d="M830 981 V1033"/><g transform="translate(70 1045)"><rect class="panel" width="1460" height="252" rx="22"/><text class="label" x="28" y="38">EVENT-TIME PROVENANCE</text>
    <g transform="translate(28 62)"><rect class="req" width="430" height="78" rx="15"/><text class="code" x="18" y="31">timestamp_source · string</text><text class="text" x="18" y="57">device_utc → agent_capture → relay_receive</text></g>
    <g transform="translate(485 62)"><rect class="req" width="430" height="78" rx="15"/><text class="code" x="18" y="31">relay_time_ns · int64</text><text class="text" x="18" y="57">Required Unix-ns metadata; not Influx time</text></g>
    <g transform="translate(942 62)"><rect class="opt" width="462" height="78" rx="15"/><text class="code" x="18" y="31">agent_capture_time_ns · int64</text><text class="text" x="18" y="57">Optional usable capture time in Unix nanoseconds</text></g>
    <rect class="opt" x="28" y="160" width="1376" height="60" rx="15"/><text class="code" x="48" y="186">device_time_value uint64 · device_time_unit string · device_time_basis string</text><text class="text" x="48" y="209">Optional message-provided device time; boot-relative values are never treated directly as Unix time</text>
  </g>

  <path class="line" d="M830 1297 V1349"/><g transform="translate(70 1362)"><rect class="panel" width="1460" height="286" rx="22"/><text class="label" x="28" y="38">ATTRIBUTION + SOURCE CONTEXT</text>
    <g transform="translate(28 62)"><rect class="opt" width="650" height="82" rx="15"/><text class="code" x="18" y="31">operator_id · flight_id · intent_id</text><text class="text" x="18" y="59">Optional string fields for active operation context</text></g>
    <g transform="translate(704 62)"><rect class="opt" width="700" height="82" rx="15"/><text class="code" x="18" y="31">intent_version · uint64</text><text class="text" x="18" y="59">Optional; omitted at zero or without intent context</text></g>
    <g transform="translate(28 164)"><rect class="opt" width="650" height="82" rx="15"/><text class="code" x="18" y="31">mavlink_system_id · uint64</text><text class="text" x="18" y="59">Optional MAVLink source identifier</text></g>
    <g transform="translate(704 164)"><rect class="opt" width="700" height="82" rx="15"/><text class="code" x="18" y="31">mavlink_component_id · uint64</text><text class="text" x="18" y="59">Optional MAVLink source identifier</text></g>
  </g>

  <g transform="translate(70 1680)"><rect class="api" width="1460" height="150" rx="22"/><text class="h" x="28" y="42">API observation boundary</text><text class="text" x="28" y="76">Returns frame_id · relay_id · session_id · timestamp_source. Uses aircraft_id to select rows.</text><text class="text" x="28" y="104">Operation-context fields support legacy/replay models but are not exposed on live observation JSON.</text><text class="text" x="28" y="132">Authenticated but unmapped points may omit aircraft_id and are intentionally invisible to aircraft queries.</text></g>
  <g transform="translate(70 1850)"><rect class="req" width="115" height="30" rx="15"/><text class="reqT" x="18" y="21">REQUIRED</text><rect class="cond" x="140" width="235" height="30" rx="15"/><text class="condT" x="158" y="21">REQUIRED FOR API READS</text><rect class="opt" x="400" width="105" height="30" rx="15"/><text class="optT" x="418" y="21">OPTIONAL</text></g>
</svg>
