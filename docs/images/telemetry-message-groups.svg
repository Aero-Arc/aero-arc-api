<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2320" viewBox="0 0 1600 2320" role="img" aria-labelledby="title desc">
  <title id="title">Aircraft telemetry message-group fan-out</title>
  <desc id="desc">The aircraft_telemetry measurement fans out into seven independently sampled API groups. Each branch identifies its canonical message name, API group, required fields, and optional typed fields. System time is shown as Relay-only and not queried.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64758a"/></marker></defs>
  <style>
    :root{color-scheme:light dark}.bg{fill:#f6f8fb}.hub{fill:#e9e3ff;stroke:#8065c8;stroke-width:2}.node{fill:#fff;stroke:#cad3df;stroke-width:2}.line{fill:none;stroke:#64758a;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#8997a8;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    .title{fill:#14243a;font:700 34px system-ui,sans-serif}.h{fill:#14243a;font:700 23px system-ui,sans-serif}.api{fill:#6b4fba;font:700 18px system-ui,sans-serif}.label{fill:#607187;font:700 14px system-ui,sans-serif;letter-spacing:1px}.code{fill:#0b5cab;font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace}.compact{font-size:14px}.text{fill:#293b50;font:16px system-ui,sans-serif}.req{fill:#def5e7;stroke:#4fa672}.opt{fill:#edf0f4;stroke:#9aa8b9}.relayOnly{fill:#fff1d6;stroke:#cc9328}.legend{fill:#54667b;font:15px system-ui,sans-serif}
    @media(prefers-color-scheme:dark){.bg{fill:#0d1520}.hub{fill:#302554;stroke:#7059aa}.node{fill:#151f2c;stroke:#435269}.title,.h{fill:#f0f5fb}.api{fill:#cbbdff}.label,.legend{fill:#aab8ca}.text{fill:#d7e0eb}.code{fill:#80c3ff}.req{fill:#173d2a;stroke:#3d9361}.opt{fill:#273342;stroke:#59687a}.relayOnly{fill:#493819;stroke:#9f792a}}
  </style>
  <rect class="bg" width="1600" height="2320" rx="24"/><text class="title" x="70" y="78">One measurement, seven independent live-state branches</text>
  <g transform="translate(500 115)"><rect class="hub" width="600" height="132" rx="28"/><text class="label" x="28" y="36">INFLUXDB MEASUREMENT</text><text class="h" x="28" y="74">aircraft_telemetry</text><text class="text" x="28" y="104">Newest row ranked per aircraft_id + message_name</text></g>
  <path d="M800 247 V292 M800 292 H400 V328 M800 292 H1200 V328" fill="none" stroke="#64758a" stroke-width="3"/>

  <g transform="translate(70 330)"><rect class="node" width="710" height="360" rx="22"/><text class="h" x="26" y="42">GLOBAL_POSITION_INT</text><text class="api" x="26" y="70">API group: position</text><rect class="req" x="26" y="92" width="658" height="76" rx="14"/><text class="label" x="44" y="118">REQUIRED · FLOAT64</text><text class="code" x="44" y="148">latitude_deg · longitude_deg</text><rect class="opt" x="26" y="186" width="658" height="145" rx="14"/><text class="label" x="44" y="212">OPTIONAL · FLOAT64</text><text class="code" x="44" y="242">altitude_msl_m · relative_altitude_m</text><text class="code" x="44" y="271">velocity_north_mps · velocity_east_mps</text><text class="code compact" x="44" y="300">velocity_down_mps · groundspeed_mps · heading_deg</text></g>
  <g transform="translate(820 330)"><rect class="node" width="710" height="360" rx="22"/><text class="h" x="26" y="42">BATTERY_STATUS</text><text class="api" x="26" y="70">API group: battery</text><rect class="req" x="26" y="92" width="658" height="62" rx="14"/><text class="label" x="44" y="117">REQUIRED · UINT64</text><text class="code" x="44" y="142">battery_id</text><rect class="opt" x="26" y="172" width="658" height="159" rx="14"/><text class="label" x="44" y="198">OPTIONAL</text><text class="code compact" x="44" y="225">string: battery_function · battery_type · battery_charge_state · battery_mode</text><text class="code compact" x="44" y="251">float64: battery_temperature_c · battery_voltage_v · battery_current_a</text><text class="code compact" x="44" y="277">battery_consumed_wh · battery_remaining_pct</text><text class="code compact" x="44" y="303">int64: battery_consumed_mah · battery_time_remaining_s</text></g>

  <path class="line" d="M400 690 V735"/><path class="line" d="M1175 690 V735"/>
  <g transform="translate(70 750)"><rect class="node" width="710" height="288" rx="22"/><text class="h" x="26" y="42">HEARTBEAT</text><text class="api" x="26" y="70">API group: vehicle</text><rect class="req" x="26" y="92" width="658" height="42" rx="14"/><text class="label" x="44" y="119">NO REQUIRED GROUP-SPECIFIC FIELDS</text><rect class="opt" x="26" y="152" width="658" height="108" rx="14"/><text class="label" x="44" y="178">OPTIONAL</text><text class="code" x="44" y="207">string: vehicle_type · autopilot_type · base_mode</text><text class="code" x="44" y="233">system_status</text><text class="code" x="44" y="255">uint64: custom_mode · mavlink_version</text></g>
  <g transform="translate(820 750)"><rect class="node" width="710" height="288" rx="22"/><text class="h" x="26" y="42">SYS_STATUS</text><text class="api" x="26" y="70">API group: system</text><rect class="req" x="26" y="92" width="658" height="42" rx="14"/><text class="label" x="44" y="119">NO REQUIRED GROUP-SPECIFIC FIELDS</text><rect class="opt" x="26" y="152" width="658" height="108" rx="14"/><text class="code compact" x="44" y="178">float64: mainloop_load_pct · communication_drop_rate_pct</text><text class="code compact" x="44" y="202">uint64: communication_error_count · autopilot_error_count_1 through _4</text><text class="code compact" x="44" y="226">string: sensors_present · sensors_enabled · sensors_health</text><text class="code compact" x="44" y="250">and their _extended forms</text></g>

  <path class="line" d="M400 1038 V1083"/><path class="line" d="M1175 1038 V1083"/>
  <g transform="translate(70 1098)"><rect class="node" width="710" height="255" rx="22"/><text class="h" x="26" y="42">VFR_HUD</text><text class="api" x="26" y="70">API group: hud</text><rect class="req" x="26" y="92" width="658" height="42" rx="14"/><text class="label" x="44" y="119">NO REQUIRED GROUP-SPECIFIC FIELDS</text><rect class="opt" x="26" y="152" width="658" height="76" rx="14"/><text class="label" x="44" y="178">OPTIONAL · FLOAT64</text><text class="code compact" x="44" y="207">airspeed_mps · groundspeed_mps · heading_deg · throttle_pct</text><text class="code compact" x="44" y="226">altitude_msl_m · climb_rate_mps</text></g>
  <g transform="translate(820 1098)"><rect class="node" width="710" height="255" rx="22"/><text class="h" x="26" y="42">EXTENDED_SYS_STATE</text><text class="api" x="26" y="70">API group: extended_state</text><rect class="req" x="26" y="92" width="658" height="42" rx="14"/><text class="label" x="44" y="119">NO REQUIRED GROUP-SPECIFIC FIELDS</text><rect class="opt" x="26" y="152" width="658" height="76" rx="14"/><text class="label" x="44" y="178">OPTIONAL · STRING</text><text class="code" x="44" y="207">vtol_state · landed_state</text></g>

  <path d="M400 1353 V1400 H800 V1435" fill="none" stroke="#64758a" stroke-width="3"/><path d="M1175 1353 V1400 H800" fill="none" stroke="#64758a" stroke-width="3"/>
  <g transform="translate(70 1445)"><rect class="node" width="1460" height="395" rx="22"/><text class="h" x="26" y="42">GPS_RAW_INT</text><text class="api" x="26" y="70">API group: gps</text><rect class="req" x="26" y="92" width="1408" height="42" rx="14"/><text class="label" x="44" y="119">NO REQUIRED GROUP-SPECIFIC FIELDS</text>
    <rect class="opt" x="26" y="152" width="1408" height="214" rx="14"/><text class="label" x="44" y="180">OPTIONAL</text><text class="code" x="44" y="211">string: gps_fix_type</text><text class="code" x="44" y="243">float64: gps_latitude_deg · gps_longitude_deg · gps_altitude_msl_m · gps_altitude_ellipsoid_m</text><text class="code" x="44" y="275">gps_hdop · gps_vdop · gps_groundspeed_mps · gps_course_over_ground_deg</text><text class="code" x="44" y="307">gps_horizontal_accuracy_m · gps_vertical_accuracy_m · gps_speed_accuracy_mps</text><text class="code" x="44" y="339">gps_heading_accuracy_deg · gps_yaw_deg</text><text class="code" x="44" y="361">uint64: gps_satellites_visible</text>
  </g>

  <path class="dash" d="M800 1840 V1895"/><g transform="translate(385 1910)"><rect class="relayOnly" width="830" height="120" rx="20"/><text class="label" x="26" y="34">RELAY-ONLY BRANCH</text><text class="h" x="26" y="68">SYSTEM_TIME</text><text class="text" x="210" y="68">normalized by Relay; not queried or exposed by GetLatestAircraftStates</text><text class="text" x="26" y="98">Adding a group requires API allowlist + decoder + domain/JSON + frontend model changes.</text></g>
  <g transform="translate(70 2075)"><rect class="hub" width="1460" height="175" rx="22"/><text class="h" x="26" y="40">Group independence is the contract</text><text class="text" x="26" y="72">Each group has its own event time and freshness. Optional values are nullable: absence is not numeric zero.</text><text class="text" x="26" y="101">Required numeric zero is valid; missing, nonnumeric, NaN, or infinite required values make only that observation malformed.</text><text class="text" x="26" y="130">A malformed row is isolated to its aircraft/message group; other independently sampled groups remain available.</text><rect class="req" x="26" y="142" width="165" height="24" rx="12"/><text class="legend" x="44" y="160">required fields</text><rect class="opt" x="210" y="142" width="165" height="24" rx="12"/><text class="legend" x="228" y="160">optional fields</text></g>
</svg>
