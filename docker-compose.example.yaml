services:
  aero-arc-api:
    build: .
    environment:
      AERO_API_ADDR: ":8080"
      AERO_API_STORE_MODE: "memory"
      AERO_API_REGISTRY_MODE: "memory"
      AERO_API_REGISTRY_ADDR: "localhost:50051"
    ports:
      - "8080:8080"

    # Future wiring:
    # - Set AERO_API_REGISTRY_MODE=grpc when aero-arc-registry is reachable at AERO_API_REGISTRY_ADDR.
    # - TiDB/Postgres durable store configuration belongs in store-specific env vars.
    # - Telemetry store configuration, such as InfluxDB, belongs in telemetry-specific env vars.
    # - Replay storage configuration, such as S3/object storage, belongs in replay-specific env vars.
    # - The frontend should call only aero-arc-api, not registry or stores directly.
